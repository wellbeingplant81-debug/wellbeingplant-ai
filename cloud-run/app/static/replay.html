<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay Viewer — AI 영상제작소</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c2430; --line:#2a3240;
  --text:#e6edf3; --dim:#8b98a9; --accent:#4c9aff; --ok:#3fb950;
  --warn:#d29922; --bad:#f85149;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650}
header .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);
  padding:2px 8px;border-radius:99px}
a{color:var(--accent);text-decoration:none;font-size:12px}
.wrap{padding:14px;max-width:1500px}
.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:14px;margin-bottom:12px}
.panel h2{font-size:12px;margin:0 0 10px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.8px}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.rule{padding:7px 13px;border-radius:99px;border:1px solid var(--line);
  color:var(--dim);cursor:pointer;font-size:13px}
.rule.on{color:var(--text);border-color:var(--accent);background:#12243d}
.rule small{display:block;font-size:10.5px;opacity:.75}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;
  text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:10.5px;color:var(--dim)}
.na-note{background:#231c0d;border:1px solid #4a3a1a;color:#d29922;
  border-radius:7px;padding:10px 12px;font-size:12.5px}
.scene{background:var(--panel2);border-radius:9px;padding:12px;
  margin-bottom:10px;border-left:3px solid var(--line)}
.scene.changed{border-left-color:var(--warn)}
.scene .head{display:flex;justify-content:space-between;gap:10px;
  align-items:baseline;flex-wrap:wrap}
.badge{font-size:10.5px;padding:2px 9px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim)}
.badge.change{color:var(--warn);border-color:#4a3a1a}
.badge.same{color:var(--ok);border-color:#1d4429}
.badge.fail{color:var(--bad);border-color:#5c2320}
table{width:100%;border-collapse:collapse;margin-top:9px;font-size:11.5px}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 6px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid #1e2530;vertical-align:top}
tr.sel td{background:#12243d}
tr.win td{background:#1b2a17}
.alt{max-width:420px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--dim)}
.gate{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.bar{flex:1;min-width:200px;height:8px;background:var(--panel2);
  border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Replay Viewer</h1>
  <span class="tag">읽기 전용</span>
  <a href="/studio">← Studio</a>
  <span class="tag" id="ruleTag">—</span>
</header>

<div class="wrap">

  <div class="panel">
    <h2>Ranking v3 착수 게이트</h2>
    <div id="gate" class="muted">불러오는 중…</div>
  </div>

  <div class="panel">
    <h2>Replay 규칙</h2>
    <div class="rules" id="rules"></div>
    <p class="muted" style="margin:10px 0 0">
      아직 채택되지 않은 가설입니다. 여기서 고르는 규칙은 실제 asset
      선택에 아무 영향을 주지 않으며, 기록된 후보 풀에만 되돌려 봅니다.
    </p>
  </div>

  <div class="panel">
    <h2>결과</h2>
    <div id="summary"></div>
  </div>

  <div id="rows"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let current = "baseline", data = null;

function fmt(x){ return x==null ? "—" : (typeof x==="number" ? x.toFixed(3) : x); }

function renderGate(g){
  if(!g){ $("gate").textContent = "—"; return; }
  const fp = Math.min(100, 100*g.failures/(g.failures+g.failures_needed||1));
  const sp = Math.min(100, 100*g.scenes/(g.scenes+g.scenes_needed||1));
  $("gate").innerHTML = `
    <p class="${g.ready?"":"muted"}">${g.reason}</p>
    <div class="gate"><span class="muted" style="width:150px">실패 스톡 scene
      ${g.failures} / ${g.failures+g.failures_needed}</span>
      <span class="bar"><i style="width:${fp}%"></i></span></div>
    <div class="gate" style="margin-top:6px"><span class="muted" style="width:150px">누적 scene
      ${g.scenes} / ${g.scenes+g.scenes_needed}</span>
      <span class="bar"><i style="width:${sp}%"></i></span></div>
    <p class="muted" style="margin:9px 0 0">착수 가능:
      <b>${g.ready ? "예" : "아니오"}</b></p>`;
}

function renderRules(rules){
  $("rules").innerHTML = rules.map(r=>`
    <div class="rule ${r.key===current?"on":""}" onclick="pick('${r.key}')">
      ${r.label}<small>${r.description}</small></div>`).join("");
}

function renderSummary(d){
  if(!d.has_data){
    $("summary").innerHTML = `<div class="na-note">${d.missing_reason}</div>`;
    $("rows").innerHTML = "";
    return;
  }
  $("summary").innerHTML = `<div class="summary">
    <div class="stat"><b>${d.scenes}</b><span>기록된 scene</span></div>
    <div class="stat"><b>${d.changed}</b><span>선택이 바뀜</span></div>
    <div class="stat"><b>${d.changed_on_failed}</b><span>실패였던 scene</span></div>
    <div class="stat"><b>${d.changed_on_passed}</b><span>통과였던 scene ⚠</span></div>
    <div class="stat"><b>${d.scenes-d.changed}</b><span>그대로</span></div>
  </div>
  ${d.changed_on_passed>0 ? `<div class="na-note" style="margin-top:10px">
    통과했던 scene의 선택이 바뀝니다. 실패를 고치면서 잘 되던 것을
    망칠 수 있다는 뜻입니다.</div>` : ""}`;
}

function renderRows(d){
  if(!d.has_data){ return; }
  $("rows").innerHTML = d.rows.map(r=>{
    const rows = r.candidates.map(c=>{
      const cls = c.would_be_selected ? "win" : (c.was_selected ? "sel" : "");
      const dv = c.delta>0?"up":(c.delta<0?"down":"flat");
      return `<tr class="${cls}">
        <td class="num">${c.index}</td>
        <td class="alt">${c.alt || c.slug || "(설명 없음)"}
          ${c.was_selected?'<span class="badge">원래 선택</span>':""}
          ${c.would_be_selected?'<span class="badge change">이 규칙의 선택</span>':""}</td>
        <td class="num">${fmt(c.relevance)}</td>
        <td class="num">-${fmt(c.human_penalty)}</td>
        <td class="num">${fmt(c.composition)}</td>
        <td class="num">${fmt(c.motion)}</td>
        <td class="num">${fmt(c.original_score)}</td>
        <td class="num">${c.original_rank}</td>
        <td class="num">${fmt(c.replay_score)}</td>
        <td class="num">${c.replay_rank}</td>
        <td class="num ${dv}">${c.delta>0?"+":""}${fmt(c.delta)}</td>
      </tr>`; }).join("");

    return `<div class="panel scene ${r.changed?"changed":""}">
      <div class="head">
        <div><b>${r.project} · scene ${r.scene}</b>
          <span class="badge">${r.provider||"—"}</span>
          ${r.regenerate?'<span class="badge fail">실패 (realism '+r.realism+')</span>':'<span class="badge same">통과</span>'}
        </div>
        <span class="badge ${r.changed?"change":"same"}">${r.status}</span>
      </div>
      <p class="muted" style="margin:6px 0 0">검색어: ${r.query||"—"}
        · 매칭 어휘: ${(r.scene_terms||[]).slice(0,8).join(", ")}</p>
      ${r.gemini_reason?`<p class="muted">Gemini: ${r.gemini_reason}</p>`:""}
      <p style="margin:8px 0 0;font-size:12.5px">
        원래: <b>${r.original_winner||"—"}</b><br>
        이 규칙: <b>${r.new_winner||"—"}</b>
        ${r.changed?` · delta ${r.delta>0?"+":""}${fmt(r.delta)}`:""}<br>
        <span class="muted">${r.reason}</span></p>
      <table>
        <tr><th>#</th><th>후보</th><th>rel</th><th>human</th><th>comp</th>
          <th>motion</th><th>원래점수</th><th>원래순위</th>
          <th>재생점수</th><th>재생순위</th><th>Δ</th></tr>
        ${rows}
      </table>
    </div>`;
  }).join("");
}

async function load(){
  const r = await fetch(`/studio/api/replay?rule=${current}`);
  if(!r.ok){ $("summary").innerHTML =
    '<div class="na-note">불러오지 못했습니다.</div>'; return; }
  data = await r.json();
  $("ruleTag").textContent = `dataset ${data.scenes}개 scene`;
  renderRules(data.rules);
  renderGate(data.gate);
  renderSummary(data);
  renderRows(data);
}

function pick(key){ current = key; load(); }

load();
</script>
</body>
</html>
